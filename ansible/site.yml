---
# Entry point. After a minimal Fedora install:
#   sudo dnf install -y ansible-core git
#   sudo ansible-pull -U https://github.com/mathiaswouters/heimora.git -C main -d /opt/heimora ansible/site.yml
#
# Re-run from the checkout later:
#   sudo ansible-playbook /opt/heimora/ansible/site.yml
#   sudo ansible-playbook /opt/heimora/ansible/site.yml --tags sway
#   sudo ansible-playbook /opt/heimora/ansible/site.yml --check
#
# Roles are ordered deliberately: base system/repos first, then the WM
# stack, then apps, then dotfiles (which may reference configs the
# previous roles' packages provide), then services/enablement last.

- name: Provision Fedora Sway environment
  hosts: all
  connection: local
  become: true
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Refresh dnf cache
      ansible.builtin.dnf:
        update_cache: true
      tags: always

  roles:
    - role: base
      tags: [base]
    - role: sway
      tags: [sway]
    - role: apps
      tags: [apps]
    - role: dotfiles
      tags: [dotfiles]
      become: true
      become_user: "{{ provision_user }}"
    - role: services
      tags: [services]

  post_tasks:
    - name: Done
      ansible.builtin.debug:
        msg: "Provisioning complete. Reboot or re-login to a Sway session."
