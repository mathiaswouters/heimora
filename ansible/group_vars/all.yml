---
# Central place to edit "what gets installed" without touching role logic.
# Cross-reference with APPS_INVENTORY.md when deciding what belongs here.

provision_user: mathias
dotfiles_repo: "https://github.com/mathiaswouters/dotfiles.git"
dotfiles_dest: "/home/{{ provision_user }}/.dotfiles"
dotfiles_version: master

# Which scopes from the dotfiles repo's links.conf apply to this machine.
# 'common' is everywhere, 'wayland' adds sway/waybar/mako, and the terminal
# scope picks exactly one of ghostty/alacritty. See links.conf for the full map.
dotfiles_scopes:
  - common
  - wayland
  - ghostty
  - alacritty

# COPRs, enabled in the apps role. Fedora proper ships none of these.
copr_repos:
  - atim/starship
  - pennbauman/ports        # lf
  - scottames/ghostty       # the source Ghostty's own docs point at
  - herzen/davinci-helper   # Fedora installer/patcher; Resolve itself is not redistributable

# cliphist landed in Fedora 44. Older releases need this COPR (enabled in
# the sway role when ansible_distribution_major_version < 44).
cliphist_copr: alternateved/cliphist

# Core system utilities, not Sway-specific
base_packages:
  - vim
  - git
  - curl
  - wget
  - tmux
  - zsh
  - htop
  - btop
  - unzip
  - tar
  - rsync
  - firewalld
  - dnf-plugins-core
  - NetworkManager-wifi
  - iwd
  - bluez
  - bluez-tools

# The Sway ecosystem itself — fill in / trim as you decide on each piece.
# See APPS_INVENTORY.md for the "what does this category even need" list.
sway_packages:
  - sway
  - swaylock
  - swayidle
  - swaybg
  - waybar
  - wofi                     # or: fuzzel, rofi-wayland
  - mako                     # notification daemon
  - grim
  - slurp
  - wl-clipboard
  - cliphist                 # Fedora 44+; COPR on older releases
  - xdg-desktop-portal-wlr
  - xdg-desktop-portal-gtk   # file pickers for Firefox / Flatpak
  - playerctl
  - blueman
  - network-manager-applet   # nm-applet, sits in the waybar tray
  - brightnessctl
  - mate-polkit
  - pipewire
  - pipewire-pulseaudio
  - wireplumber
  - pavucontrol
  # ghostty/config and waybar/style.css both ask for JetBrains Mono.
  - jetbrains-mono-fonts

# General desktop / productivity apps — placeholder list, prune to taste
app_packages:
  - firefox
  - ghostty                  # from the scottames COPR
  - alacritty
  - neovim
  - fastfetch
  - starship
  - fzf
  - ripgrep
  - fd-find
  - bat
  - jq
  - zoxide
  - lf                       # from the pennbauman/ports COPR
  - imv
  - thunar
  - tumbler                  # Thunar thumbnails
  - thunar-volman
  - thunar-archive-plugin
  - file-roller
  - gvfs
  - geany
  - caligula
  - obs-studio              # RPM Fusion (already enabled in the base role)
  - code                    # Visual Studio Code, Microsoft repo
  - cursor                  # Anysphere yum repo
  - nordvpn                 # NordVPN CLI + daemon
  - nordvpn-gui             # official GUI, same NordVPN repo
  - nodejs
  - npm
  - python3
  - python3-pip
  - python3-devel
  - golang
  # DaVinci Resolve is not in any public repo (Blackmagic login download).
  # davinci-helper installs deps and runs the .zip you download from
  # https://www.blackmagicdesign.com/products/davinciresolve
  - davinci-helper
  - libxcrypt-compat
  - mesa-libGLU

# Official RPM, no yum repo. Downloaded once by the apps role.
bitwarden_rpm_url: "https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=rpm"

# Not in Fedora/RPM Fusion. Flathub is added by the apps role.
flatpak_apps:
  - com.spotify.Client

# Official pkgs.k8s.io repos are per-minor. Bump this to pick up a new kubectl line.
# https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/
kubernetes_yum_minor: "v1.36"

# Cloud/DevOps tooling relevant to your day job — extend freely
devops_packages:
  - ansible-core
  - terraform                # from the HashiCorp repo enabled in the base role
  - kubectl                  # from the Kubernetes repo enabled in the base role
  - helm
  - awscli2
  - podman
  - podman-compose
  - docker-ce               # Docker Inc. repo, enabled in the base role
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# GTX 1060 is Pascal. NVIDIA 595+ (Fedora 44's default akmod-nvidia) dropped
# it; RPM Fusion's 580xx branch is the last that works. Turing+ would use
# unsuffixed akmod-nvidia instead. The nvidia role only installs these when
# lspci finds an NVIDIA GPU, so a VM without passthrough skips them.
nvidia_packages:
  - kernel-devel
  - akmods
  - akmod-nvidia-580xx
  - xorg-x11-drv-nvidia-580xx
  - xorg-x11-drv-nvidia-580xx-cuda
  - xorg-x11-drv-nvidia-580xx-cuda-libs
  - xorg-x11-drv-nvidia-580xx-libs.i686
  - vulkan-loader
  - libva-nvidia-driver
  - libva-utils

gaming_packages:
  - steam
  - lutris
  - gamemode
  - gamemode.i686
  - mangohud
  - mangohud.i686
  - vulkan-tools
  - protontricks
