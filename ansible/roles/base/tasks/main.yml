---
- name: Enable RPM Fusion (free + nonfree)
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true

- name: Import HashiCorp GPG key
  ansible.builtin.rpm_key:
    key: https://rpm.releases.hashicorp.com/gpg
    state: present

# terraform and friends are not shipped in the Fedora repos.
- name: Enable HashiCorp repo
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    gpgcheck: true
    enabled: true

- name: Import Kubernetes GPG key
  ansible.builtin.rpm_key:
    key: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_yum_minor }}/rpm/repodata/repomd.xml.key"
    state: present

# Fedora ships the CLI as kubernetes-client, not kubectl. pkgs.k8s.io serves one
# repo per minor version, so kubernetes_yum_minor pins which line we track.
- name: Enable Kubernetes repo
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_yum_minor }}/rpm/"
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_yum_minor }}/rpm/repodata/repomd.xml.key"
    gpgcheck: true
    enabled: true
    exclude: kubelet kubeadm cri-tools kubernetes-cni

- name: Import Microsoft GPG key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present

- name: Enable Visual Studio Code repo
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    gpgcheck: true
    enabled: true

- name: Import Cursor GPG key
  ansible.builtin.rpm_key:
    key: https://downloads.cursor.com/keys/anysphere.asc
    state: present

- name: Enable Cursor repo
  ansible.builtin.yum_repository:
    name: cursor
    description: Cursor
    baseurl: https://downloads.cursor.com/yumrepo
    gpgkey: https://downloads.cursor.com/keys/anysphere.asc
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true

- name: Import Docker GPG key
  ansible.builtin.rpm_key:
    key: https://download.docker.com/linux/fedora/gpg
    state: present

- name: Enable Docker CE repo
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
    gpgkey: https://download.docker.com/linux/fedora/gpg
    gpgcheck: true
    enabled: true

- name: Import NordVPN GPG key
  ansible.builtin.rpm_key:
    key: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    state: present

- name: Enable NordVPN repo
  ansible.builtin.yum_repository:
    name: nordvpn
    description: NordVPN
    baseurl: https://repo.nordvpn.com/yum/nordvpn/centos/$basearch/
    gpgkey: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    gpgcheck: true
    enabled: true

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

- name: Set zsh as default shell for provisioning user
  ansible.builtin.user:
    name: "{{ provision_user }}"
    shell: /usr/bin/zsh

- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
