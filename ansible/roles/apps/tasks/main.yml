---
- name: Enable atim/starship COPR
  ansible.builtin.command:
    cmd: dnf copr enable -y atim/starship
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:starship.repo

- name: Install general desktop/productivity apps
  ansible.builtin.dnf:
    name: "{{ app_packages }}"
    state: present

- name: Install cloud/devops tooling
  ansible.builtin.dnf:
    name: "{{ devops_packages }}"
    state: present

- name: Install starship prompt config directory
  ansible.builtin.file:
    path: "/home/{{ provision_user }}/.config"
    state: directory
    owner: "{{ provision_user }}"
    group: "{{ provision_user }}"
    mode: "0755"
