---
# cliphist is in Fedora 44+. On older releases pull it from COPR first so
# the sway_packages install below does not fail on a missing name.
- name: Enable cliphist COPR on Fedora older than 44
  ansible.builtin.command:
    cmd: dnf copr enable -y {{ cliphist_copr }}
    creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ cliphist_copr | replace('/', ':') }}.repo"
  when: ansible_distribution_major_version | int < 44

- name: Install Sway and companion packages
  ansible.builtin.dnf:
    name: "{{ sway_packages }}"
    state: present

- name: Enable pipewire/wireplumber for the provisioning user
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
  loop:
    - pipewire.socket
    - wireplumber.service
  become: false
  become_user: "{{ provision_user }}"
  # Note: this only works if a user session/dbus is already available
  # (e.g. run via `machinectl shell` or after first interactive login).
  # If it fails during ansible-pull (no user session/D-Bus yet), enable
  # it manually once after your first login — see README "known gotchas".
  ignore_errors: true
