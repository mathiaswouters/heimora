---
# Anything that needs to happen last: login manager choice, seat/session
# setup, one-off enablement. Kept separate from `base` so it's easy to
# see everything that affects "how do I get to a Sway session" in one file.

- name: Install a login manager (greetd + tuigreet, Sway-friendly)
  ansible.builtin.dnf:
    name:
      - greetd
      - greetd-tuigreet
    state: present

# The Fedora greetd package does not create this account, but greetd refuses to
# start without it ("configured default session user 'greeter' not found") and
# its unit Conflicts=getty@tty1.service — so a missing greeter takes the getty
# down with it and leaves VT1 dead, which reads as a hung boot.
- name: Create the greeter account greetd runs the greeter session as
  ansible.builtin.user:
    name: greeter
    system: true
    home: /var/lib/greetd
    create_home: true
    shell: /usr/sbin/nologin
    groups:
      - video
      - input
    append: true

- name: Give tuigreet a writable state directory
  ansible.builtin.file:
    path: /var/cache/tuigreet
    state: directory
    owner: greeter
    group: greeter
    mode: "0755"

- name: Install a greetd wrapper that sets NVIDIA + Sway environment
  ansible.builtin.copy:
    dest: /usr/local/bin/heimora-sway
    mode: "0755"
    content: |
      #!/bin/sh
      # Launch Sway with the env NVIDIA + wlroots need. greetd runs this
      # instead of bare `sway` so the variables exist before the compositor.
      export XDG_CURRENT_DESKTOP=sway
      export XDG_SESSION_TYPE=wayland
      if lsmod | grep -q '^nvidia'; then
        export __GLX_VENDOR_LIBRARY_NAME=nvidia
        export GBM_BACKEND=nvidia-drm
        export WLR_NO_HARDWARE_CURSORS=1
        export LIBVA_DRIVER_NAME=nvidia
        # sway <= 1.11 (what Fedora 44 ships) calls exit(EXIT_FAILURE) as soon
        # as it sees the nvidia-drm DRM driver unless this flag is passed. The
        # session dies in under a second and greetd drops straight back to
        # tuigreet, which reads as "the password did not work".
        set -- --unsupported-gpu "$@"
      fi
      exec sway "$@"

- name: Configure greetd to launch Sway
  ansible.builtin.copy:
    dest: /etc/greetd/config.toml
    content: |
      [terminal]
      vt = 1

      [default_session]
      command = "tuigreet --time --cmd /usr/local/bin/heimora-sway"
      user = "greeter"
    mode: "0644"

- name: Enable greetd
  ansible.builtin.systemd:
    name: greetd
    enabled: true

- name: Enable Bluetooth for blueman
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Enable and start the NordVPN daemon
  ansible.builtin.systemd:
    name: nordvpnd
    enabled: true
    state: started

# Starting greetd here to prove it works is not an option: its
# Conflicts=getty@tty1.service would kill the very console running
# ansible-pull. Checking that the configured session user resolves is the
# cheap version of that check, and it is the failure that bit on the VM.
- name: Confirm the greeter account resolves before handing VT1 to greetd
  ansible.builtin.command: getent passwd greeter
  changed_when: false

- name: Read the current default systemd target
  ansible.builtin.command: systemctl get-default
  register: systemd_default_target
  changed_when: false

# A minimal Fedora install boots to multi-user.target, and greetd is only
# WantedBy=graphical.target — so enabling greetd alone still drops you at a
# TTY. Without this the whole login-manager chain silently never starts.
- name: Boot into graphical.target so greetd starts
  ansible.builtin.command: systemctl set-default graphical.target
  when: systemd_default_target.stdout | trim != "graphical.target"
  changed_when: true
